name: Deploy MBN GLOBAL
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging
permissions:
  contents: read
concurrency:
  group: deploy-${{ github.event.inputs.environment || 'staging' }}
  cancel-in-progress: false
jobs:
  checks:
    if: github.ref == 'refs/heads/main' && vars.MBN_DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/validate.yml
  deploy:
    # Repository variable defaults to absent/disabled. Feature branches cannot deploy.
    if: github.ref == 'refs/heads/main' && vars.MBN_DEPLOY_ENABLED == 'true'
    needs: checks
    environment: ${{ github.event.inputs.environment || 'staging' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_TELEMETRY_DISABLED: '1'
      DO_NOT_TRACK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1
        with:
          version: 2.121.0
      - name: Check target and deliver
        run: python3 scripts/release.py --apply --confirm-project "$MBN_SUPABASE_PROJECT_REF"
        env:
          MBN_DEPLOY_ENABLED: ${{ vars.MBN_DEPLOY_ENABLED }}
          MBN_SUPABASE_PROJECT_REF: ${{ vars.MBN_SUPABASE_PROJECT_REF }}
          MBN_SUPABASE_PUBLISHABLE_KEY: ${{ vars.MBN_SUPABASE_PUBLISHABLE_KEY }}
          MBN_PUBLIC_ORIGIN: ${{ vars.MBN_PUBLIC_ORIGIN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
          MBN_INITIALIZE_CATALOG: ${{ vars.MBN_INITIALIZE_CATALOG }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: delivery-${{ github.event.inputs.environment || 'staging' }}-${{ github.sha }}
          path: .release/manifest.json
          if-no-files-found: error
          retention-days: 30
